services:
  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        PHP_VERSION: "8.5"
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    image: imbrett/laravel-toolkit:latest
    working_dir: /app
    volumes:
      - ./:/app:delegated
      - composer-cache:/home/app/.composer/cache
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${XDEBUG_CONFIG:-}"
    tty: true

volumes:
  composer-cache: