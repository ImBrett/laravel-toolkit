name: ci

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.package-matrix.outputs.changed_packages }}
      any_changed: ${{ steps.package-matrix.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - id: discover-packages
        run: |
          python - <<'PY'
import json
import os

base = "packages"
if os.path.isdir(base):
    packages = sorted(
        [
            entry
            for entry in os.listdir(base)
            if os.path.isdir(os.path.join(base, entry))
        ]
    )
else:
    packages = []
payload = json.dumps([{"name": pkg, "path": pkg} for pkg in packages])
with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
    handle.write(f"all_packages={payload}\n")
PY
      - name: Detect changed package files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            packages/**
      - id: package-matrix
        env:
          ALL_PACKAGES: ${{ steps.discover-packages.outputs.all_packages }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          python - <<'PY'
import json
import os

all_packages = json.loads(os.environ.get("ALL_PACKAGES", "[]"))
changed_files = os.environ.get("CHANGED_FILES", "")
changed_dirs = set()
for line in changed_files.splitlines():
    parts = line.split("/")
    if len(parts) >= 2 and parts[0] == "packages":
        changed_dirs.add(parts[1])

changed_packages = [pkg for pkg in all_packages if pkg["path"] in changed_dirs]

with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
    handle.write(f"changed_packages={json.dumps(changed_packages)}\n")
    handle.write(f"any_changed={'true' if changed_packages else 'false'}\n")
PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo, sqlite
          coverage: none

      - name: Install Composer (root)
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --no-progress

      - name: Install tool bins
        run: |
          composer bin phpunit update --no-interaction --no-progress || true
          composer bin phpstan update --no-interaction --no-progress || true
          composer bin ecs update --no-interaction --no-progress || true
          composer bin rector update --no-interaction --no-progress || true

      - name: Rector (dry run)
        run: ./vendor/bin/rector --config rector.php --no-diffs --dry-run

      - name: Easy Coding Standard
        run: ./vendor/bin/ecs --config ecs.php --no-progress

  quality:
    needs: lint
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo, sqlite
          coverage: none

      - name: Install Composer (root)
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-interaction --prefer-dist --no-progress

      - name: Install tool bins
        run: |
          composer bin phpunit update --no-interaction --no-progress || true
          composer bin phpstan update --no-interaction --no-progress || true
          composer bin ecs update --no-interaction --no-progress || true
          composer bin phpinsights update --no-interaction --no-progress || true
          composer bin phpmd update --no-interaction --no-progress || true

      - name: Static analysis (phpstan)
        run: composer stan

      - name: Code insights
        run: composer insights

      - name: PHP Mess Detector
        run: composer phpmd

      - name: Test suite
        run: composer test

  package-tests:
    needs: detect
    if: ${{ needs.detect.outputs.packages != '[]' && needs.detect.outputs.packages != '' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.packages) }}
        php: [ '8.3', '8.4', '8.5' ]
        laravel: [ '12.*', '13.*' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, sqlite
          coverage: none

      - name: Install package deps (pin Laravel/Testbench)
        working-directory: packages/${{ matrix.package.path }}
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-interaction --no-progress
          composer require "orchestra/testbench:^9.0 || ^10.0 || ^11.0" --dev --no-interaction --no-progress
          composer update --no-interaction --no-progress

      - name: Ensure phpunit config exists
        working-directory: packages/${{ matrix.package.path }}
        run: |
          if [ ! -f phpunit.xml ] && [ ! -f phpunit.xml.dist ]; then
            cat > phpunit.xml.dist <<'XML'
<?xml version="1.0" encoding="UTF-8"?>
<phpunit bootstrap="vendor/autoload.php" colors="true" cacheResult="true" cacheDirectory=".phpunit.cache" failOnRisky="true" failOnWarning="true">
  <php>
    <env name="APP_ENV" value="testing"/>
    <env name="DB_CONNECTION" value="sqlite"/>
    <env name="DB_DATABASE" value=":memory:"/>
    <env name="CACHE_DRIVER" value="array"/>
    <env name="QUEUE_CONNECTION" value="sync"/>
  </php>
  <testsuites>
    <testsuite name="Package">
      <directory suffix="Test.php">tests</directory>
    </testsuite>
  </testsuites>
  <source>
    <include><directory>src</directory></include>
  </source>
</phpunit>
XML
          fi

      - name: Run package tests
        working-directory: packages/${{ matrix.package.path }}
        run: vendor/bin/phpunit
